on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.event.number }}

permissions: {}

jobs:
  pkg-pr-new:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-pkg-pr-new
    if: github.repository == 'fabon-f/temporal-polyfill-lite' && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'cr-ready'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm run build
      - name: Publish
        run: pnpm dlx pkg-pr-new@0.0.65 publish --pnpm
